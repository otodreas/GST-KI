[project]
name = "otodreas-gst-ki"
version = "0.2.0"
description = "Analytical code for KI GST project. Master's thesis, Lund University MSc in Bioinformatics"
readme = "README.md"
authors = [
    { name = "Oliver Todreas", email = "otodreas@gmail.com" }
]
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "polars>=2.1.0",
    "pydantic>=2.14.3",
]

[project.urls]
Homepage = "https://github.com/otodreas/GST-KI"
Issues = "https://github.com/otodreas/GST-KI/issues"

[project.scripts]
gst-ki = "gst_ki:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "nbstripout>=0.9.1",
    "notebook>=7.6.5",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
